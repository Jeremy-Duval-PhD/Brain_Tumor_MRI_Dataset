[pytest]

# Directories where tests are located
testpaths = tests

# Allow imports from src/ without modifying PYTHONPATH manually
pythonpath = src

# Default pytest options
addopts =
    -ra
    -q
    --strict-markers
    --disable-warnings

# Custom markers definition
markers =
    slow: slow tests (e.g. training, large datasets)
    integration: integration tests (full pipeline, multiple components)
    unit: fast unit tests (isolated functions)

# Test file discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# (Optional) Enable logging in CI
log_cli = true
log_cli_level = INFO